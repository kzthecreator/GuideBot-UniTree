<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuideBot 实验室点云</title><style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#dce7ec;font:15px system-ui}header{padding:18px 24px;background:#18252f;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:19px;margin:0 0 7px}small{color:#9db1be}canvas{display:block;width:100vw;height:calc(100vh - 155px);touch-action:none}footer{padding:12px 24px;color:#a8bfca;display:flex;gap:20px;flex-wrap:wrap}button{background:#254356;color:#dce7ec;border:1px solid #577586;border-radius:5px;padding:7px 12px;cursor:pointer}#status{color:#91d8bc}#warning{color:#ffbd80}code{font-size:13px}</style>
<header><div><h1>实验室实时激光点云</h1><small>雷达坐标系 · 只读预览 · 拖动旋转，滚轮缩放</small></div><div><div id="status">等待点云…</div><small id="rates"></small></div><button id="reset">重置视角</button></header>
<canvas id="view"></canvas><footer><span id="points"></span><span id="warning">这是当前一帧点云，不是累计地图；没有自动行走功能。</span><span id="record"></span></footer>
<script>
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');let points=new Float32Array(),yaw=.7,pitch=.6,zoom=45,lastUpdate=0,cloudCount=-1,drag=null;
function fit(){const d=devicePixelRatio||1;canvas.width=canvas.clientWidth*d;canvas.height=canvas.clientHeight*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.fillStyle='#101820';ctx.fillRect(0,0,w,h);const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);function project(x,y,z){const u=cy*x-sy*y,v=sy*x+cy*y;return[w/2+u*zoom,h/2-(cp*z-sp*v)*zoom]}
ctx.strokeStyle='#293e49';ctx.lineWidth=1;for(let n=-10;n<=10;n++){for(const line of [[-10,n,0,10,n,0],[n,-10,0,n,10,0]]){const a=project(...line.slice(0,3)),b=project(...line.slice(3));ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}}
for(let i=0;i<points.length;i+=3){const x=points[i],y=points[i+1],z=points[i+2];const p=project(x,y,z);if(p[0]<0||p[0]>w||p[1]<0||p[1]>h)continue;ctx.fillStyle=`hsl(${185-Math.max(-2,Math.min(3,z))*30} 75% 63%)`;ctx.fillRect(p[0],p[1],2,2)}ctx.fillStyle='#ffba76';ctx.beginPath();ctx.arc(w/2,h/2,5,0,Math.PI*2);ctx.fill();}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(2,Math.min(300,zoom*Math.exp(-e.deltaY*.001)));draw()};document.getElementById('reset').onclick=()=>{yaw=.7;pitch=.6;zoom=45;draw()};window.onresize=fit;fit();
async function poll(){try{const status=await(await fetch('/status',{cache:'no-store'})).json();const count=status.bridge?.published?.cloud||0;if(count!==cloudCount){const r=await fetch('/cloud',{cache:'no-store'});if(r.ok){const data=await r.arrayBuffer();if(data.byteLength%12===0){points=new Float32Array(data);draw();lastUpdate=Date.now();cloudCount=count}}}const age=Date.now()-lastUpdate;document.getElementById('status').textContent=age<2000?'点云连接正常':'点云未更新';document.getElementById('status').style.color=age<2000?'#91d8bc':'#ffbd80';document.getElementById('points').textContent=`预览 ${points.length/3} 个点`;document.getElementById('rates').textContent=['cloud','imu','odom'].map(k=>`${k}: ${status.bridge?.published?.[k]||0} 条`).join(' · ');document.getElementById('record').textContent=status.recording?'正在采集到本机文件':'未开启录制';if(status.bridge?.errors?.length)document.getElementById('warning').textContent=status.bridge.errors[0];}catch(e){document.getElementById('status').textContent='等待采集服务…'}setTimeout(poll,300)}poll();
</script></html>
