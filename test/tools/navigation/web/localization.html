<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验室雷达定位</title>
<style>
body{margin:0;background:#101923;color:#e5eef8;font:16px system-ui}main{display:grid;grid-template-columns:1fr 290px;height:100vh}section{min-width:0;display:flex;flex-direction:column}header{padding:14px 20px;background:#172536}h1{font-size:20px;margin:0 0 8px}#wrap{flex:1;min-height:0;position:relative}canvas{width:100%;height:100%;display:block;touch-action:none}aside{padding:20px;background:#172536;overflow:auto}.ok{color:#6de4b4}.bad{color:#ffb581}p{line-height:1.65}dl{display:grid;grid-template-columns:1fr 1fr;gap:10px}dt{color:#a8b8cb}dd{margin:0;text-align:right}button{padding:8px;border:1px solid #7287a0;border-radius:6px;background:#24384c;color:white;cursor:pointer}small{color:#a8b8cb}@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:65vh 1fr}}
</style>
<main><section><header><h1>实验室雷达定位 · 只读</h1><span id="status">正在连接定位服务…</span></header><div id="wrap"><canvas id="map"></canvas></div></section>
<aside><h2>当前位置</h2><p>箭头表示雷达的位置与朝向。蓝色为有效跟踪，橙色为历史位置或无效结果。</p><dl id="stats"></dl><p id="reason"></p><button id="reset">地图适应窗口</button><p>拖动平移，滚轮缩放。黑色为地图障碍，白色为已观测区域，灰色为未知。</p><p>从采图起点附近、同一朝向启动。用原厂遥控器缓慢移动，观察箭头是否跟随。</p><p>若显示定位丢失，请停止本工具，回起点后重新启动，或指定正确初始位姿。</p><small>当前只显示雷达位姿，不代表机身中心。没有导航目标或运动控制按钮。</small></aside></main>
<script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),image=new Image();image.src='/map.png';let data=null,zoom=1,pan=[0,0],drag=null,lastSuccess=0;
function fit(){zoom=1;pan=[0,0];draw()}document.getElementById('reset').onclick=fit;
function draw(){const box=canvas.getBoundingClientRect();canvas.width=Math.round(box.width*devicePixelRatio);canvas.height=Math.round(box.height*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,box.width,box.height);if(!data||!image.complete||!image.naturalWidth)return;const m=data.map,s=Math.min(box.width/m.width,box.height/m.height)*.9*zoom,ox=(box.width-m.width*s)/2+pan[0],oy=(box.height-m.height*s)/2+pan[1];ctx.save();ctx.translate(ox,oy);ctx.scale(s,s);ctx.imageSmoothingEnabled=false;ctx.drawImage(image,0,0,m.width,m.height);const xy=p=>[(p[0]-m.origin[0])/m.resolution_m,m.height-(p[1]-m.origin[1])/m.resolution_m];ctx.beginPath();for(const [i,p] of (data.trajectory||[]).entries()){let q=xy(p);i?ctx.lineTo(...q):ctx.moveTo(...q)}ctx.strokeStyle='#2681db';ctx.lineWidth=1.5/s;ctx.stroke();const valid=data.valid&&Date.now()-lastSuccess<2200;if(data.pose){const q=xy(data.pose);ctx.translate(...q);ctx.rotate(-data.pose[2]);ctx.beginPath();ctx.moveTo(13/s,0);ctx.lineTo(-8/s,-7/s);ctx.lineTo(-4/s,0);ctx.lineTo(-8/s,7/s);ctx.closePath();ctx.fillStyle=valid?'#075ee8':'#d97000';ctx.strokeStyle='white';ctx.lineWidth=1.5/s;ctx.fill();ctx.stroke()}ctx.restore()}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){pan[0]+=e.clientX-drag[0];pan[1]+=e.clientY-drag[1];drag=[e.clientX,e.clientY];draw()}};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.min(10,Math.max(.3,zoom*Math.exp(-e.deltaY*.001)));draw()};image.onload=draw;window.onresize=draw;
const labels={waiting:'等待数据',tracking:'定位跟踪中',rejected:'当前帧定位无效',lost:'定位丢失',stale:'数据已过期',stopped:'定位服务已停止'};
function show(){const d=data;if(!d)return;const good=d.valid&&Date.now()-lastSuccess<2200;const st=document.getElementById('status');st.className=good?'ok':'bad';st.textContent=Date.now()-lastSuccess<2200?(labels[d.state]||d.state):'连接中断，当前位置无效';document.getElementById('reason').textContent=d.reason||'';const fmt=(v,n=2)=>Number.isFinite(v)?v.toFixed(n):'—';const values=[['状态',good?'有效':'无效 / 历史'],['X (米)',fmt(d.pose?.[0])],['Y (米)',fmt(d.pose?.[1])],['朝向 (度)',fmt(d.pose?d.pose[2]*180/Math.PI:NaN,1)],['重合率',fmt(d.overlap*100,1)+'%'],['内点RMS (厘米)',fmt(d.inlier_rms_m*100,1)],['接收到结果 (ms)',fmt(d.receive_to_result_ms,0)],['有效 / 拒绝',`${d.accepted} / ${d.rejected}`]];const dl=document.getElementById('stats');dl.replaceChildren();for(const [k,v] of values){let dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;dl.append(dt,dd)}draw()}
async function poll(){try{const r=await fetch('/status',{cache:'no-store',signal:AbortSignal.timeout(1800)});if(!r.ok)throw Error(r.status);data=await r.json();lastSuccess=Date.now();show()}catch(e){if(data){data.valid=false;data.state='stale'}show()}finally{setTimeout(poll,350)}}setInterval(show,500);poll();
</script></html>
